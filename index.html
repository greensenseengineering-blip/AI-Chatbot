<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Core Omniscience v12.1 | API-Integrated</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .chat-container { height: calc(100vh - 320px); min-height: 400px; }
        .evolution-bar { transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .ai-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-2 md:p-6 min-h-screen flex flex-col">
    <div class="max-w-6xl mx-auto w-full bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col my-auto">
        
        <div class="p-5 border-b border-slate-800 bg-slate-950/50 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-10 h-10 rounded-xl bg-cyan-950 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                        <svg class="w-6 h-6 ai-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                </div>
                <div>
                    <h1 class="font-bold text-slate-100 tracking-tight text-lg">NEURAL CORE OMNISCIENCE</h1>
                    <p class="text-[10px] text-cyan-500 font-mono uppercase tracking-widest font-bold">API-INTEGRATED v12.1</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden sm:block text-right">
                    <div class="text-[9px] uppercase text-slate-500 font-bold">Model Status</div>
                    <div class="text-xs font-mono text-cyan-300" id="compute-status">GEMINI-3-FLASH</div>
                </div>
                <div class="w-32 h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div id="evo-bar" class="evolution-bar w-[45%] h-full bg-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.5)]"></div>
                </div>
            </div>
        </div>

        <div id="chat" class="chat-container p-6 overflow-y-auto space-y-6 custom-scrollbar bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 max-w-[80%]">
                <p class="text-sm text-slate-300 leading-relaxed italic">"Tieto on synteesi. Olen kytketty Generatiiviseen API-arkkitehtuuriin. Kysy mitä tahansa, niin teen reaaliaikaisen analyysin."</p>
            </div>
        </div>

        <div class="p-5 border-t border-slate-800 bg-slate-950">
            <div class="flex gap-3">
                <input id="input" type="text" placeholder="Kirjoita kysymys..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-5 py-4 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500">
                <button onclick="handleInput()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-8 py-4 rounded-xl text-sm transition shadow-lg shadow-cyan-950">LÄHETÄ</button>
            </div>
        </div>
    </div>

    <script>
        async function fetchAIResponse(userPrompt) {
            const apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent";
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userPrompt }] }]
                })
            });

            if (!response.ok) throw new Error("API Connection Failed");
            
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function handleInput() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const query = input.value.trim();
            if(!query) return;

            // User Message
            const uMsg = document.createElement('div');
            uMsg.className = 'bg-slate-700/50 p-4 rounded-xl text-sm self-end ml-auto max-w-[70%] border border-slate-600';
            uMsg.innerText = query;
            chat.appendChild(uMsg);
            
            // Loading Animation
            const lMsg = document.createElement('div');
            lMsg.className = 'text-xs text-cyan-500 font-mono animate-pulse';
            lMsg.innerText = "> Suoritetaan API-kutsua...";
            chat.appendChild(lMsg);

            input.value = '';

            try {
                const response = await fetchAIResponse(query);
                chat.removeChild(lMsg);

                const aMsg = document.createElement('div');
                aMsg.className = 'bg-slate-800 p-5 rounded-2xl border-l-4 border-cyan-500 max-w-[85%] text-sm leading-relaxed';
                aMsg.innerHTML = response;
                chat.appendChild(aMsg);
                chat.scrollTop = chat.scrollHeight;

                const evoBar = document.getElementById('evo-bar');
                const currentWidth = parseInt(evoBar.style.width) || 45;
                evoBar.style.width = Math.min(100, currentWidth + 5) + "%";
            } catch (err) {
                lMsg.innerText = "> Virhe: API-yhteys epäonnistui.";
            }
        }
    </script>
</body>
</html>
