<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Core AI v8.0 - Live Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .chat-container { height: calc(100vh - 280px); }
        .message-ai { background: #0f172a; border-left: 3px solid #22d3ee; }
        .message-user { background: #1e293b; border-right: 3px solid #f43f5e; }
        .typing { display: inline-block; width: 8px; height: 8px; background: #22d3ee; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        .source-link { color: #38bdf8; font-size: 10px; text-decoration: underline; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-2xl">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-950">
            <h2 class="font-bold text-cyan-400 tracking-wider">NEURAL CORE v8.0 | LIVE</h2>
            <div class="flex gap-2">
                <span class="text-[10px] text-emerald-500 font-mono italic">Search Enabled</span>
                <button onclick="clearChat()" class="text-[10px] bg-red-900/30 text-red-400 px-2 rounded hover:bg-red-800">RESET</button>
            </div>
        </div>

        <div id="chat" class="chat-container p-6 overflow-y-auto space-y-4">
            <div class="message-ai p-4 rounded-lg text-sm mr-auto w-4/5">AI: Järjestelmä online. Käytössä Google Search -tuki. Kysy mitä tahansa!</div>
        </div>

        <div class="p-4 border-t border-slate-700 bg-slate-950">
            <div id="status" class="text-[10px] text-slate-500 font-mono mb-2 h-4">System Idle</div>
            <div class="flex gap-2">
                <textarea id="input" rows="1" placeholder="Hae tietoa tai kysy..." class="flex-1 bg-slate-800 border border-slate-600 rounded p-2 focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                <button onclick="handleSearch()" class="bg-cyan-900 text-cyan-400 px-6 py-2 rounded hover:bg-cyan-800 font-bold transition">HAE</button>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const status = document.getElementById('status');

        async function handleSearch() {
            const query = input.value.trim();
            if (!query) return;
            addMessage(query, 'user');
            input.value = '';
            status.innerHTML = '<span class="typing"></span> Searching web...';

            try {
                // Using Gemini API with Search Grounding
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: query }] }],
                        tools: [{ "google_search": {} }]
                    })
                });

                const data = await response.json();
                const result = data.candidates?.[0]?.content?.parts?.[0]?.text || "Ei vastausta.";
                const sources = data.candidates?.[0]?.groundingMetadata?.groundingAttributions || [];
                
                addMessage(result, 'ai', sources);
                status.innerText = "System Idle";
            } catch (err) {
                addMessage("Virhe haussa. Tarkista yhteys.", 'ai');
                status.innerText = "Error";
            }
        }

        function addMessage(text, sender, sources = []) {
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'message-user p-4 rounded-lg text-sm ml-auto w-4/5' : 'message-ai p-4 rounded-lg text-sm mr-auto w-4/5';
            
            let html = (sender === 'ai' ? 'AI: ' : '') + text.replace(/\n/g, '<br>');
            
            if (sources.length > 0) {
                html += '<div class="mt-4 border-t border-slate-700 pt-2"><p class="text-[9px] text-slate-500">Lähteet:</p>';
                sources.forEach(s => {
                    if (s.web?.uri) html += `<a href="${s.web.uri}" target="_blank" class="source-link block">${s.web.title || 'Lähde'}</a>`;
                });
                html += '</div>';
            }
            
            div.innerHTML = html;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function clearChat() { chat.innerHTML = ''; }
        input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSearch(); } });
    </script>
</body>
</html>
